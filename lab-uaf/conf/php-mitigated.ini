[PHP]
; === MITIGATED CONFIGURATION ===
; session.upload_progress.enabled = Off disables the vulnerable
; rfc1867 callback entirely. The multipart parser still runs but the
; session progress pointers are never armed.

session.upload_progress.enabled = Off
session.upload_progress.cleanup = On
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.prefix = upload_progress_
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 0

session.save_handler = files
session.save_path = /var/lib/php/sessions
session.auto_start = 0

file_uploads = On
post_max_size = 64M
upload_max_filesize = 64M
upload_tmp_dir = /tmp

error_reporting = E_ALL
display_errors = On
log_errors = On
error_log = /var/log/php-fpm/php_errors.log
